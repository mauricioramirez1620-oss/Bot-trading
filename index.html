<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexTrader v2.5 - KuCoin Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-2 space-y-2">

  <!-- Header / Estado -->
  <header class="flex justify-between items-center bg-slate-900 border border-slate-800 rounded-xl p-2.5">
    <div class="flex items-center gap-2">
      <span class="text-xs">🧠</span>
      <h1 class="font-bold text-xs">ApexTrader <span class="text-[9px] text-purple-400">v2.5 (KuCoin)</span></h1>
    </div>
    <div class="flex gap-1">
      <button id="modeDemoBtn" type="button" class="px-2 py-0.5 rounded text-[9px] font-bold bg-blue-600 text-white">DEMO</button>
      <button id="modeRealBtn" type="button" class="px-2 py-0.5 rounded text-[9px] font-bold text-gray-400">REAL</button>
      <span id="statusBadge" class="text-[9px] font-bold text-red-500 bg-red-500/10 px-1.5 py-0.5 rounded border border-red-500/30">DETENIDO</span>
    </div>
  </header>

  <!-- Configuración de API KuCoin -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-2">
    <details class="group">
      <summary class="text-[9px] font-bold text-purple-400 cursor-pointer flex justify-between items-center">
        <span>⚙️ Configurar Credenciales API KuCoin</span>
        <span class="text-xs">▼</span>
      </summary>
      <div class="mt-2 space-y-1.5 pt-2 border-t border-slate-800">
        <div>
          <label class="text-[8px] text-gray-400 block">API Key:</label>
          <input type="text" id="kucoinKey" placeholder="Pega tu API Key aquí" class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[9px] text-white">
        </div>
        <div>
          <label class="text-[8px] text-gray-400 block">Secret Key:</label>
          <input type="password" id="kucoinSecret" placeholder="Pega tu Secret Key aquí" class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[9px] text-white">
        </div>
        <div>
          <label class="text-[8px] text-gray-400 block">Passphrase:</label>
          <input type="password" id="kucoinPass" placeholder="Tu contraseña de API" class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[9px] text-white">
        </div>
        <button id="saveKeysBtn" type="button" class="w-full py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-[10px] rounded">Guardar Llaves</button>
      </div>
    </details>
  </section>

  <!-- Panel de Control y Estrategia -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-2">
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[9px] text-gray-400 block mb-0.5">ESTRATEGIA:</label>
        <select id="strategySelect" class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[10px] text-white">
          <option value="smc">Smart Money Concepts (SMC)</option>
          <option value="crt">CRT (Range Sweep)</option>
        </select>
      </div>
      <div>
        <label class="text-[9px] text-gray-400 block mb-0.5">Temporalidad:</label>
        <select class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[10px] text-white">
          <option>1 Minuto (Scalping)</option>
          <option>15 Minutos</option>
        </select>
      </div>
    </div>

    <!-- Mercado y Datos -->
    <div class="grid grid-cols-3 gap-1.5 text-center pt-1 border-t border-slate-800">
      <div class="bg-black/40 p-1 rounded border border-slate-800">
        <p class="text-[8px] text-gray-400">Tendencia</p>
        <p id="trendLabel" class="text-[10px] font-bold text-amber-400">Buscando...</p>
      </div>
      <div class="bg-black/40 p-1 rounded border border-slate-800">
        <p class="text-[8px] text-gray-400">Estructura</p>
        <p id="structureLabel" class="text-[10px] font-bold text-blue-400">Ruptura (BOS)</p>
      </div>
      <div class="bg-black/40 p-1 rounded border border-slate-800">
        <p class="text-[8px] text-gray-400">ATR</p>
        <p class="text-[10px] font-bold text-purple-400">14.50 pts</p>
      </div>
    </div>
  </section>

  <!-- SECCIÓN DEL GRÁFICO INCORPORADO -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2">
    <div class="flex justify-between items-center mb-1">
      <h3 class="text-[9px] font-bold text-gray-400 uppercase">Gráfico BTC/USDT (KuCoin)</h3>
      <div class="flex items-center gap-2">
        <span id="smcSignal" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-gray-400">STANDBY</span>
        <span class="text-[9px] text-emerald-400 font-bold">En Vivo</span>
      </div>
    </div>
    <div class="w-full h-72 rounded overflow-hidden bg-black border border-slate-800">
      <iframe src="
