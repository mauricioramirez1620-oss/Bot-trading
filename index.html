<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexTrader v2.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-2 space-y-2">

  <!-- Header / Estado -->
  <header class="flex justify-between items-center bg-slate-900 border border-slate-800 rounded-xl p-2.5">
    <div class="flex items-center gap-2">
      <span class="text-xs">🧠</span>
      <h1 class="font-bold text-xs">ApexTrader <span class="text-[9px] text-purple-400">v2.5</span></h1>
    </div>
    <div class="flex gap-1">
      <button id="modeDemoBtn" type="button" class="px-2 py-0.5 rounded text-[9px] font-bold bg-blue-600 text-white">DEMO</button>
      <button id="modeRealBtn" type="button" class="px-2 py-0.5 rounded text-[9px] font-bold text-gray-400">REAL</button>
      <span id="statusBadge" class="text-[9px] font-bold text-red-500 bg-red-500/10 px-1.5 py-0.5 rounded border border-red-500/30">DETENIDO</span>
    </div>
  </header>

  <!-- Panel de Control y Estrategia -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-2">
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[9px] text-gray-400 block mb-0.5">ESTRATEGIA:</label>
        <select id="strategySelect" class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[10px] text-white">
          <option value="smc">Smart Money Concepts (SMC)</option>
          <option value="crt">CRT (Range Sweep)</option>
        </select>
      </div>
      <div>
        <label class="text-[9px] text-gray-400 block mb-0.5">Temporalidad CRT:</label>
        <select class="w-full bg-black border border-slate-800 rounded px-1.5 py-1 text-[10px] text-white">
          <option>15 Minutos</option>
          <option>1 Minuto</option>
        </select>
      </div>
    </div>

    <!-- Mercado y Datos -->
    <div class="grid grid-cols-3 gap-1.5 text-center pt-1 border-t border-slate-800">
      <div class="bg-black/40 p-1 rounded border border-slate-800">
        <p class="text-[8px] text-gray-400">Tendencia</p>
        <p id="trendLabel" class="text-[10px] font-bold text-amber-400">Buscando...</p>
      </div>
      <div class="bg-black/40 p-1 rounded border border-slate-800">
        <p class="text-[8px] text-gray-400">Estructura</p>
        <p id="structureLabel" class="text-[10px] font-bold text-blue-400">Ruptura (BOS)</p>
      </div>
      <div class="bg-black/40 p-1 rounded border border-slate-800">
        <p class="text-[8px] text-gray-400">ATR</p>
        <p class="text-[10px] font-bold text-purple-400">14.50 pts</p>
      </div>
    </div>
  </section>

  <!-- SECCIÓN DEL GRÁFICO EN VIVO TRADINGVIEW -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2">
    <div class="flex justify-between items-center mb-1">
      <h3 class="text-[9px] font-bold text-gray-400 uppercase">Gráfico BTC/USDT (1M)</h3>
      <span class="text-[9px] text-emerald-400 font-bold">En Vivo</span>
    </div>
    <!-- Contenedor del Widget de TradingView -->
    <div id="tradingview_widget" class="w-full h-64 rounded overflow-hidden bg-black border border-slate-800"></div>
  </section>

  <!-- Billetera y Precios -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-2">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-[9px] text-gray-400">Billetera Real:</p>
        <h3 id="walletBalance" class="text-sm font-bold font-mono text-white">$0.00 USDT</h3>
      </div>
      <div class="flex gap-1">
        <button id="depBtn" type="button" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[9px] rounded">+ Depósito</button>
        <button id="witBtn" type="button" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold text-[9px] rounded">- Retiro</button>
      </div>
    </div>

    <!-- Precios Bid/Ask y Lotaje -->
    <div class="grid grid-cols-2 gap-2 text-center pt-1 border-t border-slate-800">
      <div class="bg-red-500/10 border border-red-500/30 p-1 rounded">
        <p class="text-[8px] font-bold text-red-400">SELL (BID)</p>
        <h4 id="sellPrice" class="text-sm font-bold font-mono text-red-400">85528.37</h4>
      </div>
      <div class="bg-blue-500/10 border border-blue-500/30 p-1 rounded">
        <p class="text-[8px] font-bold text-blue-400">BUY (ASK)</p>
        <h4 id="buyPrice" class="text-sm font-bold font-mono text-blue-400">85545.41</h4>
      </div>
    </div>

    <!-- Lotaje -->
    <div class="flex items-center justify-between bg-black/50 rounded p-1 border border-slate-800">
      <span class="text-[9px] text-gray-400">Lotes:</span>
      <div class="flex gap-1 items-center">
        <button id="lotMinus1" type="button" class="px-2 py-0.5 bg-slate-800 text-gray-300 font-mono text-[10px] rounded">-0.01</button>
        <span id="lotInput" class="text-xs font-bold font-mono text-white px-2">0.02</span>
        <button id="lotPlus1" type="button" class="px-2 py-0.5 bg-slate-800 text-gray-300 font-mono text-[10px] rounded">+0.01</button>
      </div>
    </div>
  </section>

  <!-- Capital y P&L -->
  <section class="grid grid-cols-2 gap-2">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 text-center">
      <p class="text-[9px] font-medium text-gray-400">Capital Operativo</p>
      <h3 id="metricCapital" class="text-xs font-bold font-mono text-white mt-0.5">$10,041.38</h3>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 text-center">
      <p class="text-[9px] font-medium text-gray-400">P&L Diario</p>
      <h3 id="metricPnl" class="text-xs font-bold font-mono text-emerald-400 mt-0.5">+$0.00</h3>
    </div>
  </section>

  <!-- BOTONES PRINCIPALES DE ACCIÓN -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-1.5">
    <div class="grid grid-cols-2 gap-2">
      <button id="startBtn" type="button" class="py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg shadow-lg">Iniciar Bot</button>
      <button id="pauseBtn" type="button" disabled class="py-2 bg-amber-500/20 text-amber-500 font-bold text-xs rounded-lg opacity-50">Pausar</button>
    </div>
    <button id="killBtn" type="button" class="w-full py-1.5 bg-red-500/20 text-red-400 font-bold text-[10px] rounded-lg border border-red-500/30">Kill Switch (Detener)</button>
  </section>

  <!-- Terminal Logs -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-2">
    <h3 class="text-[9px] font-bold uppercase text-gray-400 mb-1">Consola de Eventos</h3>
    <div id="consoleTerminal" class="bg-black/90 rounded p-1.5 font-mono text-[9px] h-24 overflow-y-auto space-y-0.5 text-gray-300 border border-slate-800"></div>
  </section>

  <!-- Script del Widget de TradingView -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    // Inicializar el gráfico avanzado de TradingView
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "1",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "es",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
