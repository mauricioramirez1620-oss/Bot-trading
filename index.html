<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtester CRT Scalping (XAUUSD)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        h1 { color: #4CAF50; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 5px; }
        button:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; }
        th { background-color: #333; color: #fff; }
        .win { color: #4CAF50; font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }
        .container { max-width: 900px; margin: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulador / Bot CRT Scalping (1m)</h1>
    <p>Este script simula la lógica de Candle Range Theory buscando barridos de liquidez y calculando R:R 1:2.</p>
    <button onclick="ejecutarBacktest()">Ejecutar Simulación</button>
    
    <div id="resultados-summary" style="margin-top: 15px; font-size: 18px;"></div>

    <table id="tabla-trades">
        <thead>
            <tr>
                <th>Tipo</th>
                <th>Precio Entrada</th>
                <th>Stop Loss</th>
                <th>Take Profit</th>
                <th>Resultado</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los trades simulados aparecerán aquí -->
        </tbody>
    </table>
</div>

<script>
    // Datos simulados de ejemplo (OHLCV: Open, High, Low, Close)
    // En un bot real, esto se conectaría a un archivo CSV o API de precios.
    const velas1m = [
        {h: 4130, l: 4120, o: 4122, c: 4125}, // Referencia inicial
        {h: 4132, l: 4121, o: 4125, c: 4128},
        {h: 4135, l: 4124, o: 4128, c: 4131},
        {h: 4136, l: 4125, o: 4131, c: 4129}, // Vela normal
        {h: 4138, l: 4118, o: 4129, c: 4126}  // ¡Barrido bajista (ManipLow) y cierra dentro!
    ];

    function ejecutarBacktest() {
        const lookback = 3;
        const rr = 2.0;
        const atrFicticio = 1.5; // Margen simulado
        let tbody = document.querySelector("#tabla-trades tbody");
        tbody.innerHTML = ""; // Limpiar tabla
        
        let tradesExitosos = 0;
        let tradesTotales = 0;

        // Bucle simulando el comportamiento vela por vela a partir del lookback
        for (let i = lookback; i < velas1m.length; i++) {
            // Calcular rango de referencia previo
            let sliceVelas = velas1m.slice(i - lookback, i);
            let refHigh = Math.max(...sliceVelas.map(v => v.h));
            let refLow = Math.min(...sliceVelas.map(v => v.l));

            let velaActual = velas1m[i];

            // Detección de manipulación CRT
            let manipHigh = velaActual.h >= refHigh && velaActual.c < refHigh;
            let manipLow  = velaActual.l <= refLow && velaActual.c > refLow;

            if (manipLow) {
                tradesTotales++;
                let entry = velaActual.c;
                let sl = velaActual.l - atrFicticio;
                let risk = entry - sl;
                let tp = entry + (risk * rr);

                // Simulamos si el precio tocó TP o SL en la siguiente evolución
                // Para este ejemplo rápido, determinamos un resultado aleatorio o basado en el siguiente cierre
                let win = Math.random() > 0.4; // 60% probabilidad simulada de éxito con la estrategia
                if (win) tradesExitosos++;

                let fila = `<tr>
                    <td>LONG</td>
                    <td>${entry.toFixed(2)}</td>
                    <td>${sl.toFixed(2)}</td>
                    <td>${tp.toFixed(2)}</td>
                    <td class="${win ? 'win' : 'loss'}">${win ? 'WIN (TP)' : 'LOSS (SL)'}</td>
                </tr>`;
                tbody.innerHTML += fila;
            }
        }

        let summary = document.getElementById("resultados-summary");
        if(tradesTotales > 0) {
            let winRate = ((tradesExitosos / tradesTotales) * 100).toFixed(1);
            summary.innerHTML = `Trades Totales: <b>${tradesTotales}</b> | Efectividad: <b>${winRate}%</b>`;
        } else {
            summary.innerHTML = `No se detectaron suficientes patrones en los datos de prueba actuales. ¡Agrega más velas al array!`;
        }
    }
</script>

</body>
</html>
