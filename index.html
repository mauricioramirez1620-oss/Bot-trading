<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD CRT Scalping Bot</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0e11; color: #d1d4dc; padding: 12px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { color: #0ecb81; font-size: 18px; margin: 0; }
        .badge { background: #1e2329; padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #f0b90b; border: 1px solid #2b313a; }
        .status-box { background: #1e2329; padding: 10px; border-radius: 6px; margin-bottom: 12px; border-left: 4px solid #0ecb81; font-size: 12px; }
        #canvas-wrapper { width: 100%; height: 240px; background: #161a1e; border-radius: 6px; margin-bottom: 12px; border: 1px solid #2b313a; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        h3 { font-size: 14px; margin: 10px 0 6px 0; color: #848e9c; }
        .table-container { max-height: 180px; overflow-y: auto; border-radius: 6px; border: 1px solid #2b313a; }
        table { width: 100%; border-collapse: collapse; background: #1e2329; font-size: 11px; text-align: center; }
        th, td { border-bottom: 1px solid #2b313a; padding: 6px 4px; }
        th { background-color: #2b313a; color: #848e9c; position: sticky; top: 0; }
        .long { color: #0ecb81; font-weight: bold; }
        .short { color: #f6465d; font-weight: bold; }
        .price-tag { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 4px; font-size: 12px; font-family: monospace; color: #0ecb81; }
    </style>
</head>
<body>

<div class="header">
    <h1>CRT Scalping XAUUSD</h1>
    <div class="badge">Live 1m</div>
</div>

<div class="status-box" id="status-text">
    Iniciando motor gráfico y sincronizando mercado...
</div>

<div id="canvas-wrapper">
    <div class="price-tag" id="price-display">4133.50</div>
    <canvas id="chartCanvas"></canvas>
</div>

<h3>Señales Institucionales (Cierre de Vela)</h3>
<div class="table-container">
    <table id="signals-table">
        <thead>
            <tr>
                <th>Hora</th>
                <th>Entrada</th>
                <th>Señal</th>
                <th>SL</th>
                <th>TP (1:2)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="5" style="color: #848e9c;">Esperando configuración de barrido CRT...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const priceDisplay = document.getElementById('price-display');
    const tableBody = document.querySelector('#signals-table tbody');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let candles = [];
    let basePrice = 4133.50;

    // Generar historial de 25 velas iniciales estables alrededor de 4133+
    for (let i = 0; i < 25; i++) {
        let open = basePrice;
        let close = open + (Math.random() * 2.4 - 1.2);
        let high = Math.max(open, close) + Math.random() * 1.2;
        let low = Math.min(open, close) - Math.random() * 1.2;
        candles.push({ open, high, low, close });
        basePrice = close;
    }

    let lastProcessedMinute = -1;

    function renderChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        let h = canvas.height;
        let count = candles.length;
        let candleWidth = w / count;

        let minPrice = Math.min(...candles.map(c => c.low));
        let maxPrice = Math.max(...candles.map(c => c.high));
        let priceRange = maxPrice - minPrice || 1;

        // Dibujar cuadrícula tenue
        ctx.strokeStyle = '#2b313a';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
            let y = (h / 4) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }

        // Dibujar velas
        candles.forEach((c, idx) => {
            let x = idx * candleWidth + (candleWidth / 2);
            let mapY = (price) => h - 15 - ((price - minPrice) / priceRange) * (h - 30);

            let yOpen = mapY(c.open);
            let yClose = mapY(c.close);
            let yHigh = mapY(c.high);
            let yLow = mapY(c.low);

            let isGreen = c.close >= c.open;
            let color = isGreen ? '#0ecb81' : '#f6465d';

            // Mecha
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(x, yHigh);
            ctx.lineTo(x, yLow);
            ctx.stroke();

            // Cuerpo
            let bodyY = Math.min(yOpen, yClose);
            let bodyHeight = Math.max(Math.abs(yOpen - yClose), 1.5);
            let bodyWidth = Math.max(candleWidth - 3, 2);

            ctx.fillStyle = color;
            ctx.fillRect(x - (bodyWidth / 2), bodyY, bodyWidth, bodyHeight);
        });

        let currentPrice = candles[candles.length - 1].close;
        priceDisplay.innerText = currentPrice.toFixed(2);
    }

    // Bucle del sistema en tiempo real sincronizado con minutos
    function runBot() {
        setInterval(() => {
            let now = new Date();
            let currentMinute = now.getMinutes();

            let lastCandle = candles[candles.length - 1];
            // Movimiento dinámico realista del precio del oro
            let simulatedPrice = lastCandle.close + (Math.random() * 0.8 - 0.4);
            simulatedPrice = parseFloat(simulatedPrice.toFixed(2));

            statusText.innerHTML = `<b>Estado:</b> Monitoreando Rango 20 Velas | XAUUSD: <span style="color: #0ecb81;">${simulatedPrice}</span>`;

            if (currentMinute === lastProcessedMinute) {
                // Actualiza la vela abierta del minuto actual en curso
                lastCandle.close = simulatedPrice;
                if (simulatedPrice > lastCandle.high) lastCandle.high = simulatedPrice;
                if (simulatedPrice < lastCandle.low) lastCandle.low = simulatedPrice;
            } else {
                // CIERRE DE VELA DE 1 MINUTO EXACTO (Evaluación institucional CRT)
                lastProcessedMinute = currentMinute;

                let newCandle = {
                    open: lastCandle.close,
                    high: Math.max(lastCandle.close, simulatedPrice),
                    low: Math.min(lastCandle.close, simulatedPrice),
                    close: simulatedPrice
                };

                candles.push(newCandle);
                if (candles.length > 40) candles.shift();

                // Lógica estricta CRT con lookback de 20 velas
                if (candles.length >= 22) {
                    let lookback = 20;
                    let refSlice = candles.slice(candles.length - 1 - lookback, candles.length - 1);
                    let refHigh = Math.max(...refSlice.map(c => c.high));
                    let refLow = Math.min(...refSlice.map(c => c.low));

                    let closedCandle = candles[candles.length - 2]; // Vela cerrada anterior

                    let sweepHigh = closedCandle.high >= refHigh && closedCandle.close < refHigh;
                    let sweepLow  = closedCandle.low <= refLow && closedCandle.close > refLow;

                    if (sweepHigh || sweepLow) {
                        let type = sweepHigh ? "SHORT" : "LONG";
                        let sl = sweepHigh ? closedCandle.high + 1.2 : closedCandle.low - 1.2;
                        let risk = Math.abs(closedCandle.close - sl);
                        let tp = sweepHigh ? closedCandle.close - (risk * 2) : closedCandle.close + (risk * 2);

                        if (tableBody.innerHTML.includes("Esperando")) {
                            tableBody.innerHTML = "";
                        }

                        let timeStr = now.toLocaleTimeString();
                        let rowHTML = `<tr>
                            <td>${timeStr}</td>
                            <td><b>${closedCandle.close.toFixed(2)}</b></td>
                            <td class="${type.toLowerCase()}">${type} CRT</td>
                            <td>${sl.toFixed(2)}</td>
                            <td>${tp.toFixed(2)}</td>
                        </tr>`;
                        
                        tableBody.insertAdjacentHTML('afterbegin', rowHTML);
                    }
                }
            }

            renderChart();
        }, 2000);
    }

    window.onload = () => {
        resizeCanvas();
        renderChart();
        runBot();
    };
</script>

</body>
</html>
